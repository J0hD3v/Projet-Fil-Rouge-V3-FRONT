# Nom du pipeline
name: CI/CD + node + Apache
# Déclencheurs push et pull request github
on:
  push:
    branches: [ "test", "main" ]
  pull_request:
    branches: [ "test" , "main"]
  workflow_dispatch:

jobs:
  # e2e pas encore mis
  # Deploiement
  deploy:
    runs-on : ubuntu-latest
    # needs : e2e
    steps:
      # Récupération du code
      - name: Checkout
        uses: actions/checkout@v4
      # configuration de NodeJs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Installer les dépendances NodeJS
      - name: NodeJS install
        run: |
          npm i
      # Build le code
      - name: NodeJS install
        run: |
          npm run build
      # Deploiement (github action) 
      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/


